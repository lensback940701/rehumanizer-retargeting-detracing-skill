name: Publish approved RRD v3.4 snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-snapshot.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and import the approved publication snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, struct, urllib.request, zipfile, zlib
          SOURCE = 'https://oaisdmntprwestus.blob.core.windows.net/files/00000000-d800-8230-bc12-5a1aa8b66f35/raw?se=2026-10-05T03%3A14%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=01a10a04-e8aa-7161-9d7c-b8ead9746226&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T15%3A40%3A24Z&ske=2026-10-05T15%3A40%3A24Z&sks=b&skv=2026-02-06&sig=mIlu8C69YDNFWAbDnJCqaMqiUKNSz0GtRaqKoRhBLho%3D'
          CARRIER_SHA = '862a51024f45fb639b80ce92ea8967ea2a1265de0d42552be31957430da8a3e7'
          ARCHIVE_SHA = '008acce659b84d9fa0d8860792a76727588b053ce73940d4fc2b5e5ae0e2b92f'
          repo = os.environ['REPOSITORY']
          if repo != 'lensback940701/rehumanizer-retargeting-detracing-skill':
              raise SystemExit('Wrong publication destination.')
          api = 'https://api.github.com/repos/' + repo
          def request(path, data=None, method=None):
              payload = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(api + path, data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'User-Agent': 'RRD-publication'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          with urllib.request.urlopen(SOURCE, timeout=60) as response:
              carrier = response.read(20000001)
          if len(carrier) > 20000000 or hashlib.sha256(carrier).hexdigest() != CARRIER_SHA:
              raise SystemExit('Transfer checksum mismatch.')
          if carrier[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid transfer envelope.')
          position = 8
          payloads = []
          while position + 12 <= len(carrier):
              length = struct.unpack('>I', carrier[position:position+4])[0]
              kind = carrier[position+4:position+8]
              data = carrier[position+8:position+8+length]
              crc = struct.unpack('>I', carrier[position+8+length:position+12+length])[0]
              if zlib.crc32(kind + data) & 0xffffffff != crc:
                  raise SystemExit('Invalid envelope CRC.')
              if kind == b'rrDp':
                  payloads.append(data)
              position += length + 12
              if kind == b'IEND':
                  break
          if len(payloads) != 1 or hashlib.sha256(payloads[0]).hexdigest() != ARCHIVE_SHA:
              raise SystemExit('Archive checksum mismatch.')
          files = {}
          with zipfile.ZipFile(io.BytesIO(payloads[0])) as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if item.is_dir() or path.is_absolute() or '..' in path.parts or path.parts[0] in {'.git', '.github'}:
                      raise SystemExit('Unexpected archive entry: ' + item.filename)
                  if item.filename in files or item.file_size > 15000000:
                      raise SystemExit('Duplicate or oversized archive entry.')
                  if (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Symbolic links are not allowed.')
                  files[item.filename] = archive.read(item)
          if len(files) != 114 or sum(map(len, files.values())) > 25000000:
              raise SystemExit('Unexpected publication scope.')
          manifest = json.loads(files['PUBLICATION_MANIFEST.json'])
          def check_entries(entries):
              for entry in entries:
                  if hashlib.sha256(files[entry['path']]).hexdigest() != entry['sha256']:
                      raise SystemExit('File checksum mismatch: ' + entry['path'])
          check_entries(manifest['files'])
          check_entries(manifest['original_authored_files'])
          if len(manifest['original_authored_files']) != 28:
              raise SystemExit('Original skill inventory mismatch.')
          expected_images = {'docs/images/' + name + '.png' for name in ['hero-cyber','overview','quickstart','workflow','before-after','test-results']}
          if {path for path in files if path.endswith('.png')} != expected_images:
              raise SystemExit('Illustration inventory mismatch.')
          head = request('/git/ref/heads/main')['object']['sha']
          parent = request('/git/commits/' + head)
          current_tree = request('/git/trees/' + parent['tree']['sha'] + '?recursive=1')
          for entry in current_tree['tree']:
              if entry['type'] == 'blob' and entry['path'] != 'README.md' and not entry['path'].startswith('.github/workflows/'):
                  raise SystemExit('Unexpected existing file; refusing to overwrite: ' + entry['path'])
          changes = []
          expected_blobs = {}
          for path, raw in sorted(files.items()):
              expected_blobs[path] = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\x00' + raw).hexdigest()
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if path.endswith(('.png', '.zip')):
                  blob = request('/git/blobs', {'encoding':'base64','content':base64.b64encode(raw).decode('ascii')})
                  if blob['sha'] != expected_blobs[path]:
                      raise SystemExit('Uploaded blob mismatch: ' + path)
                  entry['sha'] = blob['sha']
              else:
                  entry['content'] = raw.decode('utf-8')
              changes.append(entry)
          verification = {'version':'v3.4','archive_sha256':ARCHIVE_SHA,'imported_files':len(files),
                          'original_skill_files_preserved':28,'original_resolution_images':6,
                          'checksums':'ALL_MATCH','new_manuscript_benchmark':'NOT_RUN',
                          'license':'NOT_ASSIGNED','release_tag':'NOT_CREATED'}
          changes.append({'path':'PUBLICATION_VERIFICATION.json','mode':'100644','type':'blob',
                          'content':json.dumps(verification,indent=2)+'\n'})
          tree = request('/git/trees', {'base_tree':parent['tree']['sha'],'tree':changes})
          result_tree = request('/git/trees/' + tree['sha'] + '?recursive=1')
          actual_blobs = {entry['path']:entry['sha'] for entry in result_tree['tree'] if entry['type']=='blob'}
          if any(actual_blobs.get(path) != sha for path,sha in expected_blobs.items()):
              raise SystemExit('Repository tree verification failed.')
          commit = request('/git/commits', {'message':'feat: publish RRD v3.4 with bilingual docs, six illustrations and verified skill download',
                                           'tree':tree['sha'],'parents':[head]})
          request('/git/refs/heads/main', {'sha':commit['sha'],'force':False}, method='PATCH')
          print('PUBLISHED_COMMIT=' + commit['sha'])
          print(json.dumps(verification))
          PY
